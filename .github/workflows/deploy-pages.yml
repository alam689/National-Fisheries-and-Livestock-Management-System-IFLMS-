name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nflms-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nflms-app/package-lock.json

      - run: npm ci

      - name: Enable and configure Pages
        # enablement: true turns Pages on (build_type: workflow) if it is not
        # already, so no manual Settings -> Pages step is needed. Requires the
        # pages: write permission granted above.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        # Serve from https://<user>.github.io/<repo>/ — derived from the repo name so a
        # rename does not silently break asset URLs.
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules, so a deep link like /visits would 404.
        # Serving index.html as the 404 page lets the client router take over.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nflms-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
